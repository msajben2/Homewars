<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HOME WARS - Truhlica s Pokladom</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0d0d11;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Hlavný panel s ovládacími prvkami */
        #ui-panel {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            display: flex;
            gap: 12px;
            background: rgba(20, 20, 28, 0.85);
            padding: 12px 24px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(8px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
        }

        .tier-btn {
            background: #2a2a38;
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 8px 16px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .tier-btn:hover {
            transform: translateY(-2px);
            background: #3a3a4d;
        }

        .btn-b { border-color: #cd7f32; color: #cd7f32; }
        .btn-a { border-color: #c0c0c0; color: #c0c0c0; }
        .btn-s { border-color: #ffd700; color: #ffd700; }

        /* Nápoveda v dolnej časti */
        #info {
            position: absolute;
            bottom: 20px;
            width: 100%;
            text-align: center;
            color: rgba(255, 255, 255, 0.7);
            font-size: 14px;
            pointer-events: none;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.8);
            z-index: 10;
        }

        /* 3D Canvas plátno */
        #canvas-container {
            width: 100vw;
            height: 100vh;
        }
    </style>

    <!-- Načítanie Three.js knižníc -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>

    <div id="ui-panel">
        <button class="tier-btn btn-b" onclick="spustOtvorenie('B')">Otvoriť B-Class (Bronz)</button>
        <button class="tier-btn btn-a" onclick="spustOtvorenie('A')">Otvoriť A-Class (Striebro)</button>
        <button class="tier-btn btn-s" onclick="spustOtvorenie('S')">Otvoriť S-Class (Zlato)</button>
    </div>

    <div id="info">Ťahaním myšou otáčaj a posúvaj scénu, aby si si prezrel vypadnuté karty a mince.</div>

    <div id="canvas-container"></div>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        let scene, camera, renderer, controls;
        let aktualnaTruhla = null;
        let vypadnutyLoot = [];

        function init() {
            const container = document.getElementById('canvas-container');

            // 1. Scéna
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0d0d11);

            // 2. Kamera
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 1.0, 4.5);

            // 3. Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.shadowMap.enabled = true;
            container.appendChild(renderer.domElement);

            // 4. Ovládanie pohľadu
            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.enablePan = true;
            controls.target.set(0, 0, 0);

            // 5. Osvetlenie
            const ambientLight = new THREE.AmbientLight(0xffffff, 1.2);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 2.5);
            dirLight.position.set(5, 10, 7);
            scene.add(dirLight);

            const pointLight = new THREE.PointLight(0xffaa00, 1.5, 6);
            pointLight.position.set(0, 0.5, 0.5);
            scene.add(pointLight);

            // Spustenie predvolenej S-Class truhlice
            naciataj3DTruhlu('S');

            window.addEventListener('resize', onWindowResize);
            animate();
        }

        // Globálna funkcia pre tlačidlá z UI
        window.spustOtvorenie = function(tier) {
            naciataj3DTruhlu(tier);
        };

        function naciataj3DTruhlu(chestTier) {
            // Vyčistenie predchádzajúceho objektu a lootu
            if (aktualnaTruhla) scene.remove(aktualnaTruhla);
            vypadnutyLoot.forEach(item => scene.remove(item));
            vypadnutyLoot = [];

            const loader = new GLTFLoader();

            // Načítanie súboru zo zložky Img/
            loader.load('Img/truhla.glb', (gltf) => {
                aktualnaTruhla = gltf.scene;
                scene.add(aktualnaTruhla);

                // Umiestnenie truhlice presne do stredu
                aktualnaTruhla.position.set(0, -0.3, 0);
                aktualnaTruhla.scale.set(1.2, 1.2, 1.2);

                // Farby podľa triedy
                const tierColors = {
                    'B': { metal: 0xcd7f32 }, // Bronz
                    'A': { metal: 0xc0c0c0 }, // Striebro
                    'S': { metal: 0xffd700 }  // Zlato
                };
                const currentTheme = tierColors[chestTier] || tierColors['B'];

                // Prefarbenie kovov
                aktualnaTruhla.traverse((child) => {
                    if (child.isMesh && (child.name.toLowerCase().includes('metal') || child.name.toLowerCase().includes('iron') || child.name.toLowerCase().includes('lock') || child.name.toLowerCase().includes('hinge'))) {
                        child.material.color.setHex(currentTheme.metal);
                        child.material.metalness = 0.9;
                        child.material.roughness = 0.2;
                    }
                });

                // Vytvorenie 3D puncu na prednej strane
                vytvorPunc(aktualnaTruhla, chestTier, currentTheme.metal);

                // Nájdenie veka a spustenie animácie
                let lid = null;
                aktualnaTruhla.traverse((child) => {
                    if (child.name.toLowerCase().includes('lid') || child.name.toLowerCase().includes('top') || child.name.toLowerCase().includes('cover')) {
                        lid = child;
                    }
                });

                let openProgress = 0;
                function animateOpen() {
                    if (openProgress < 1) {
                        openProgress += 0.025;
                        if (lid) {
                            lid.rotation.x = -Math.PI * 0.45 * Math.sin(openProgress * Math.PI / 2);
                        }
                        requestAnimationFrame(animateOpen);
                    } else {
                        vybuchLootu(scene, aktualnaTruhla.position, chestTier);
                    }
                }

                setTimeout(animateOpen, 500);
            }, undefined, (error) => {
                console.error("Chyba pri načítavaní Img/truhla.glb:", error);
            });
        }

        // Vytvorenie odznaku (PUNC B / A / S)
        function vytvorPunc(chest, tier, metalColor) {
            const canvas = document.createElement('canvas');
            canvas.width = 128;
            canvas.height = 128;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = '#' + metalColor.toString(16).padStart(6, '0');
            ctx.beginPath();
            ctx.arc(64, 64, 52, 0, Math.PI * 2);
            ctx.fill();
            ctx.lineWidth = 8;
            ctx.strokeStyle = '#ffffff';
            ctx.stroke();

            ctx.fillStyle = '#000000';
            ctx.font = 'bold 64px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(tier, 64, 64);

            const texture = new THREE.CanvasTexture(canvas);
            const badgeGeo = new THREE.PlaneGeometry(0.35, 0.35);
            const badgeMat = new THREE.MeshBasicMaterial({ map: texture, transparent: true });
            const badgeMesh = new THREE.Mesh(badgeGeo, badgeMat);

            badgeMesh.position.set(0, 0.35, 0.75);
            chest.add(badgeMesh);
        }

        // Vystrelenie mincí a kariet z truhlice
        function vybuchLootu(scene, originPos, tier) {
            const itemsCount = tier === 'S' ? 14 : (tier === 'A' ? 10 : 6);

            for (let i = 0; i < itemsCount; i++) {
                const isCoin = i % 2 === 0;
                const geometry = isCoin 
                    ? new THREE.CylinderGeometry(0.1, 0.1, 0.02, 16) 
                    : new THREE.BoxGeometry(0.25, 0.35, 0.01);

                const color = isCoin ? 0xffd700 : 0x3b82f6; 
                const material = new THREE.MeshStandardMaterial({ color: color, metalness: 0.8, roughness: 0.2 });
                const loot = new THREE.Mesh(geometry, material);

                loot.position.set(originPos.x, originPos.y + 0.4, originPos.z + 0.3);
                scene.add(loot);
                vypadnutyLoot.push(loot);

                const angle = (i / itemsCount) * Math.PI * 2;
                const forceX = Math.cos(angle) * (0.6 + Math.random() * 0.8);
                const forceZ = Math.sin(angle) * (0.6 + Math.random() * 0.8);
                const targetY = -0.3;

                let t = 0;
                const startX = loot.position.x;
                const startZ = loot.position.z;
                const startY = loot.position.y;

                function animateLoot() {
                    if (t < 1) {
                        t += 0.03;
                        loot.position.x = startX + forceX * t;
                        loot.position.z = startZ + forceZ * t;
                        loot.position.y = startY + (targetY - startY) * t + Math.sin(t * Math.PI) * 1.0;
                        loot.rotation.x += 0.1;
                        loot.rotation.y += 0.15;
                        requestAnimationFrame(animateLoot);
                    } else {
                        loot.position.y = targetY;
                        if (isCoin) {
                            loot.rotation.x = Math.PI / 2;
                        } else {
                            loot.rotation.x = 0;
                            loot.rotation.y = 0;
                        }
                    }
                }
                setTimeout(animateLoot, i * 45);
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        init();
    </script>
</body>
</html>
