<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Otváranie Truhlice - 3D</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #111;
            font-family: sans-serif;
        }
        #info {
            position: absolute;
            top: 15px;
            width: 100%;
            text-align: center;
            color: #fff;
            font-size: 18px;
            pointer-events: none;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }
    </style>
</head>
<body>

    <div id="info">Klikni a ťahaj myšou na posun/otáčanie scény. Truhlica sa otvára...</div>

    <!-- Import Three.js a doplnkov cez CDN -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        let scene, camera, renderer, controls;

        function init() {
            // 1. Scéna a kamera
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x181818);

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 0.5, 4);

            // 2. Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.body.appendChild(renderer.domElement);

            // 3. Ovládanie myšou (posun a otáčanie)
            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.enablePan = true; // Umožňuje posúvať okno / scénu
            controls.target.set(0, 0, 0);

            // 4. Osvetlenie scény
            const ambientLight = new THREE.AmbientLight(0xffffff, 1.2);
            scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0xffffff, 2.0);
            directionalLight.position.set(5, 10, 7);
            scene.add(directionalLight);

            const pointLight = new THREE.PointLight(0xffaa00, 2, 5);
            pointLight.position.set(0, 0, 0);
            scene.add(pointLight);

            // 5. Načítanie truhlice (Môžeš zmeniť triedu na 'B', 'A' alebo 'S')
            loadChest('S');

            // Resize okna
            window.addEventListener('resize', onWindowResize);
        }

        function loadChest(chestTier = 'S') {
            const loader = new GLTFLoader();

            loader.load('Img/truhla.glb', (gltf) => {
                const chest = gltf.scene;
                scene.add(chest);
                
                // Umiestnenie truhlice do stredu obrazovky
                chest.position.set(0, -0.3, 0);
                chest.scale.set(1.2, 1.2, 1.2);

                // Definícia farieb pre kovy a odlesky podľa triedy
                const tierColors = {
                    'B': { metal: 0xcd7f32 }, // Bronzová
                    'A': { metal: 0xc0c0c0 }, // Strieborná
                    'S': { metal: 0xffd700 }  // Zlatá (S-Class)
                };
                const currentTheme = tierColors[chestTier] || tierColors['B'];

                // Prefarbenie kovových častí truhlice
                chest.traverse((child) => {
                    if (child.isMesh && (child.name.toLowerCase().includes('metal') || child.name.toLowerCase().includes('iron') || child.name.toLowerCase().includes('lock') || child.name.toLowerCase().includes('hinge'))) {
                        child.material.color.setHex(currentTheme.metal);
                        child.material.metalness = 0.9;
                        child.material.roughness = 0.2;
                    }
                });

                // Pridanie 3D puncu na čelo truhle
                createChestBadge(chest, chestTier, currentTheme.metal);

                // Nájdenie veka a jeho otvorenie
                let lid = null;
                chest.traverse((child) => {
                    if (child.name.toLowerCase().includes('lid') || child.name.toLowerCase().includes('top') || child.name.toLowerCase().includes('cover')) {
                        lid = child;
                    }
                });

                let openProgress = 0;
                function animateOpen() {
                    if (openProgress < 1) {
                        openProgress += 0.025;
                        if (lid) {
                            // Plynulé odklopenie veka dozadu
                            lid.rotation.x = -Math.PI * 0.45 * Math.sin(openProgress * Math.PI / 2);
                        }
                        requestAnimationFrame(animateOpen);
                    } else {
                        // Keď je truhla otvorená, spustíme výbuch mincí a kariet
                        spawnLootExplosion(scene, chest.position, chestTier);
                        document.getElementById('info').innerText = "Truhlica otvorená! Loot je na zemi.";
                    }
                }
                
                // Spustenie otvárania po 0.6 sekunde
                setTimeout(animateOpen, 600);
            }, undefined, (error) => {
                console.error("Chyba pri načítavaní truhlice (skontroluj či je súbor v Img/truhla.glb):", error);
                document.getElementById('info').innerText = "Chyba: Nepodarilo sa načítať Img/truhla.glb";
            });
        }

        // Vytvorenie 3D puncu s písmenom (B, A, S)
        function createChestBadge(chest, tier, metalColor) {
            const canvas = document.createElement('canvas');
            canvas.width = 128;
            canvas.height = 128;
            const ctx = canvas.getContext('2d');
            
            ctx.fillStyle = '#' + metalColor.toString(16).padStart(6, '0');
            ctx.beginPath();
            ctx.arc(64, 64, 52, 0, Math.PI * 2);
            ctx.fill();
            ctx.lineWidth = 8;
            ctx.strokeStyle = '#ffffff';
            ctx.stroke();

            ctx.fillStyle = '#000000';
            ctx.font = 'bold 64px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(tier, 64, 64);

            const texture = new THREE.CanvasTexture(canvas);
            const badgeGeo = new THREE.PlaneGeometry(0.35, 0.35);
            const badgeMat = new THREE.MeshBasicMaterial({ map: texture, transparent: true });
            const badgeMesh = new THREE.Mesh(badgeGeo, badgeMat);
            
            badgeMesh.position.set(0, 0.35, 0.75); // Pozícia na prednej strane truhly
            chest.add(badgeMesh);
        }

        // Efekt výbuchu mincí a kariet von z truhly na zem
        function spawnLootExplosion(scene, originPos, tier) {
            const itemsCount = tier === 'S' ? 14 : (tier === 'A' ? 10 : 6);
            
            for (let i = 0; i < itemsCount; i++) {
                // Striedavo mince (valec) a karty (kváder)
                const isCoin = i % 2 === 0;
                const geometry = isCoin 
                    ? new THREE.CylinderGeometry(0.1, 0.1, 0.02, 16) 
                    : new THREE.BoxGeometry(0.25, 0.35, 0.01);
                
                const color = isCoin ? 0xffd700 : 0x3b82f6; // Zlatá pre mince, modrá pre karty
                const material = new THREE.MeshStandardMaterial({ color: color, metalness: 0.8, roughness: 0.2 });
                const loot = new THREE.Mesh(geometry, material);

                loot.position.set(originPos.x, originPos.y + 0.4, originPos.z + 0.3);
                scene.add(loot);

                const angle = (i / itemsCount) * Math.PI * 2;
                const forceX = Math.cos(angle) * (0.6 + Math.random() * 0.8);
                const forceZ = Math.sin(angle) * (0.6 + Math.random() * 0.8);
                const targetY = -0.3; // Úroveň zeme okolo truhlice

                let t = 0;
                const startX = loot.position.x;
                const startZ = loot.position.z;
                const startY = loot.position.y;

                function animateLoot() {
                    if (t < 1) {
                        t += 0.03;
                        loot.position.x = startX + forceX * t;
                        loot.position.z = startZ + forceZ * t;
                        loot.position.y = startY + (targetY - startY) * t + Math.sin(t * Math.PI) * 1.0; // Oblúk letu
                        loot.rotation.x += 0.1;
                        loot.rotation.y += 0.15;
                        requestAnimationFrame(animateLoot);
                    } else {
                        // Po dopade ostanú stabilne ležať na zemi
                        loot.position.y = targetY;
                        if (isCoin) {
                            loot.rotation.x = Math.PI / 2;
                        } else {
                            loot.rotation.x = 0;
                            loot.rotation.y = 0;
                        }
                    }
                }
                setTimeout(animateLoot, i * 45); // Postupné vyprsknutie
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // Hlavná renderovacia slučka
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        init();
        animate();
    </script>
</body>
</html>
