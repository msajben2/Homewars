<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rodinná hra - Home Wars</title>
    <link rel="stylesheet" href="style.css">
</head>
<body onclick="spustitHudbuPoPrvomKliknuti()">

    <audio id="bg-music" loop></audio>

    <div class="audio-control-bar">
        <button id="mute-btn" onclick="prepniZvuk()" style="background:none; border:none; color:#ffcc00; font-size:1.2em; cursor:pointer;">🔊</button>
        <input type="range" id="volume-slider" min="0" max="1" step="0.05" value="0.4" oninput="upravHlasitost(this.value)" style="width:70px;">
    </div>

    <div id="hlavne-menu" class="menu-container">
        <h1 class="game-title">🏰 HOME WARS 🏰</h1>
        <p class="game-subtitle">Kráľovská kartová stratégia</p>

        <div class="menu-buttons">
            <button class="btn-menu" onclick="spustitZapasLokálnePVP()">⚔️ Mníchovský Súboj (PVP 1v1)</button>
            <button class="btn-menu" onclick="zobraziťMenuAI()">🤖 Zápas proti AI Botovi</button>
            <button class="btn-menu" onclick="otvoriťDeckbuilder()">🎴 Vytvoriť Zostavu (Deckbuilder)</button>
            <button class="btn-menu" onclick="otvoriťDielňu()">🔨 Kráľovská Dielňa (Forge)</button>
            <button class="btn-menu" onclick="otvoriťObchod()">🛒 Player-Driven Trhovisko</button>
            <button class="btn-menu" onclick="otvoriťNavodHry()">📖 Kronika & Návod Hry</button>
            
            <button class="btn-menu" style="background:#523f29; border-color:#ffcc00;" onclick="otvorTruhluVitaza()">🏆 Otvoriť Truhlu Víťaza (Video Test)</button>
            <button class="btn-menu" style="background:#3a2e20;" onclick="otvorTruhluUcastnika()">📦 Otvoriť Truhlu Účastníka (Video Test)</button>
        </div>

        <!-- ROZBALOVACIE MENU SUROVÍN A POKLADNICE -->
        <div class="inventory-dropdown-container">
            <button class="btn-inventory-toggle" onclick="prepniRozbalovanieBatohu()">🎒 Kráľovská Pokladnica & Batoh ▼</button>
            <div id="inventory-dropdown-content" class="inventory-dropdown-content" style="display: none;"></div>
        </div>
    </div>

    <div id="hracia-plocha" class="board-container" style="display: none;">
        
        <div class="player-header p2-header">
            <div class="player-info">
                <span class="player-name">Hráč 2 (Súper)</span>
                <span id="p2-rounds" class="round-indicators">⚪</span>
            </div>
            <div id="p2-score" class="score-badge">0</div>
            <button class="btn-pass" onclick="hracPassuje(2)">🏳️ Pass (P2)</button>
        </div>

        <div id="p2-hand" class="card-hand p2-hand"></div>

        <div class="board-half p2-board">
            <div id="p2-row3" class="board-row row-animals" data-row="3"><span class="row-label">3. Rad (Zvieratá)</span></div>
            <div id="p2-row2" class="board-row row-women" data-row="2"><span class="row-label">2. Rad (Ženy)</span></div>
            <div id="p2-row1" class="board-row row-men" data-row="1"><span class="row-label">1. Rad (Muži)</span></div>
        </div>

        <div id="neutral-row" class="board-row row-neutral">
            <span class="row-label-neutral">⚡ Neutrálne Kúzla Stola ⚡</span>
        </div>

        <div class="board-half p1-board">
            <div id="p1-row1" class="board-row row-men" data-row="1"><span class="row-label">1. Rad (Muži)</span></div>
            <div id="p1-row2" class="board-row row-women" data-row="2"><span class="row-label">2. Rad (Ženy)</span></div>
            <div id="p1-row3" class="board-row row-animals" data-row="3"><span class="row-label">3. Rad (Zvieratá)</span></div>
        </div>

        <div id="p1-hand" class="card-hand p1-hand"></div>

        <div class="player-header p1-header">
            <div class="player-info">
                <span class="player-name">Hráč 1 (Ty)</span>
                <span id="p1-rounds" class="round-indicators">⚪</span>
            </div>
            <div id="p1-score" class="score-badge">0</div>
            <button class="btn-pass" onclick="hracPassuje(1)">🏳️ Pass (P1)</button>
            <button class="btn-exit" onclick="zobraziťObrazovku('hlavne-menu')">🚪 Opustiť Zápas</button>
        </div>

    </div>

    <div id="deckbuilder-modal" class="card-modal" style="display: none;" onclick="if(event.target === this) this.style.display='none';">
        <div class="modal-content">
            <span class="card-modal-close" onclick="document.getElementById('deckbuilder-modal').style.display='none'">&times;</span>
            <h2 class="modal-title">🎴 VYTVORIŤ ZOSTRAVU DO HRY</h2>
            <div id="deckbuilder-zoznam" class="dielna-grid"></div>
        </div>
    </div>

    <div id="dielna-modal" class="card-modal" style="display: none;" onclick="if(event.target === this) this.style.display='none';">
        <div class="modal-content">
            <span class="card-modal-close" onclick="document.getElementById('dielna-modal').style.display='none'">&times;</span>
            <h2 class="modal-title">🔨 KRÁĽOVSKÁ DIELŇA (FORGE)</h2>
            <div id="dielna-zoznam" class="dielna-grid"></div>
        </div>
    </div>

    <div id="obchod-modal" class="card-modal" style="display: none;" onclick="if(event.target === this) this.style.display='none';">
        <div class="modal-content">
            <span class="card-modal-close" onclick="document.getElementById('obchod-modal').style.display='none'">&times;</span>
            <h2 class="modal-title">🛒 PLAYER-DRIVEN TRHOVISKO & AUKCIE</h2>
            <div id="obchod-regaly-zoznam"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
